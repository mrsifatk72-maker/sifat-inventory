# Supabase CLI configuration for MediVerse Dental CMS.
# Used by `supabase start` (local stack) and as the reference for the hosted
# project's settings. Auth settings for the hosted project are applied with
# `supabase config push` or in the dashboard — see docs/PHASE1_SETUP.md.

project_id = "mediverse-dental"

[api]
enabled = true
port = 54321
# Only the public schema is exposed through the Data API. The "private"
# schema (helper functions) is intentionally NOT listed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "env(SITE_URL)"
additional_redirect_urls = ["env(ADMIN_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Admin accounts are invite-only. Nobody can sign up from the website.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
email_sent = 2

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
